# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

env:
  TF_USER: kanzat
  TF_TOOL: kanzattool1
  ARTIFACT_FILE: ukwikitasks.jar

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Gradle 9 (used by jwiki) needs JDK 17+; the bot itself is compiled with --release 11
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Gradle (also validates the jwiki wrapper)
        uses: gradle/actions/setup-gradle@v6

      - name: Build jwiki and the bot
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: target/${{env.ARTIFACT_FILE}}
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    # Pull requests (and manual runs on other branches) only build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: artifact

      - name: Set TF_TOOL_DIR env variable
        run: echo "TF_TOOL_DIR=/data/project/${TF_TOOL}" >> $GITHUB_ENV

      # After this step `ssh toolforge` / `scp ... toolforge:` work without extra options
      - name: Set up SSH access to Toolforge
        env:
          SSH_KEY: ${{secrets.DC_PASS}}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/toolforge
          chmod 600 ~/.ssh/toolforge
          # Host key from `ssh-keyscan -t ed25519 login.toolforge.org`; check that `ssh-keygen -l -f -` of it matches the
          # ED25519 fingerprint at https://wikitech.wikimedia.org/wiki/Help:SSH_Fingerprints/login.toolforge.org
          echo 'login.toolforge.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHHCaBsit1GY3TeucMi3gDEIpQ8uNhokVa0dr/tM6PZa' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host toolforge
            HostName login.toolforge.org
            User ${TF_USER}
            IdentityFile ~/.ssh/toolforge
            BatchMode yes
            ConnectTimeout 10
          EOF

      - name: Create startcmd.sh
        run: |
          FIRST_SSH=$(cat <<'EOF'
          become ${{env.TF_TOOL}} bash -c "install -m 755 <(echo '/usr/bin/java -jar ${{env.TF_TOOL_DIR}}/${{env.ARTIFACT_FILE}} --org.kanzatbot.credentials.location="${{env.TF_TOOL_DIR}}/credentials.properties"') ${{env.TF_TOOL_DIR}}/startcmd.sh"
          EOF
          )
          ssh toolforge "$FIRST_SSH"

      - name: Copy the jar and the job definitions
        run: scp "./${ARTIFACT_FILE}" ./toolforge/jobs.yaml "toolforge:${TF_TOOL_DIR}/"

      - name: Load the Toolforge jobs
        run: ssh toolforge "become ${TF_TOOL} toolforge jobs load ${TF_TOOL_DIR}/jobs.yaml"
