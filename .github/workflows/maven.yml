# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

env:
  TF_USER: kanzat
  TF_TOOL: kanzattool1
  ARTIFACT_FILE: ukwikitasks.jar

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Gradle 9 (used by jwiki) needs JDK 17+; the bot itself is compiled with --release 11
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Gradle (also validates the jwiki wrapper)
        uses: gradle/actions/setup-gradle@v6

      - name: Build jwiki and the bot
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: target/${{env.ARTIFACT_FILE}}
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    # Pull requests (and manual runs on other branches) only build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: artifact

      - name: Set TF_TOOL_DIR env variable
        run: echo "TF_TOOL_DIR=/data/project/${TF_TOOL}" >> $GITHUB_ENV

      - name: Copy artifacts to ToolForge over SSH and redeploy
        # Pinned to a commit: this third-party action receives the Toolforge SSH key
        uses: cross-the-world/ssh-scp-ssh-pipelines@78e864b4890087a58248ff39320406971ca88b89 # v1.1.4
        with:
          host: login.toolforge.org
          user: ${{env.TF_USER}}
          key: ${{secrets.DC_PASS}}
          connect_timeout: 10s
          # Create a credentials file with 600 mode
          # Create a startcmd.sh file
          first_ssh: |
            become ${{env.TF_TOOL}} bash -c "install -m 755 <(echo '/usr/bin/java -jar ${{env.TF_TOOL_DIR}}/${{env.ARTIFACT_FILE}} --org.kanzatbot.credentials.location="${{env.TF_TOOL_DIR}}/credentials.properties"') ${{env.TF_TOOL_DIR}}/startcmd.sh"
          scp: |
            './${{env.ARTIFACT_FILE}}' => ${{env.TF_TOOL_DIR}}/
            './.github/workflows/deploy.sh' => ${{env.TF_TOOL_DIR}}/
          last_ssh: |
            become ${{env.TF_TOOL}} sh ${{env.TF_TOOL_DIR}}/deploy.sh
